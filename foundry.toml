[profile.default]
src              = "contracts"
out              = "out"
libs             = ["lib"]
test             = "test"
script           = "script"
solc_version     = "0.8.34"
auto_detect_solc = false
optimizer        = true
optimizer_runs   = 200
via_ir           = false
# Strip metadata for deterministic builds (audit reproducibility)
bytecode_hash    = "none"
cbor_metadata    = false

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[profile.default.fuzz]
runs = 10000

# forge lint — silence test-only warnings (auditors don't lint test code,
# OpenZeppelin's ERC20.transfer never returns false, only reverts).
[lint]
exclude_lints = ["erc20-unchecked-transfer"]

[profile.default.invariant]
runs               = 1000
depth              = 100
fail_on_revert     = false

[profile.ci]
verbosity      = 3
fuzz           = { runs = 50000 }
invariant      = { runs = 5000, depth = 200 }

[fmt]
line_length     = 100
tab_width       = 4
bracket_spacing = true
int_types       = "long"
quote_style     = "double"

[rpc_endpoints]
base         = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base         = { key = "${BASESCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
